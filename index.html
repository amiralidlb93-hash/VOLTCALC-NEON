<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOLTCALC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="brand">VOLTCALC</h1>
    <p class="tagline">NEON POWERED CALCULATOR</p>

    <div class="calc" id="calc">
      <div class="halo"></div>

      <div class="screen">
        <div class="expr" id="expr"></div>
        <div class="value" id="value">0</div>
      </div>

      <div class="keys" id="keys">
        <button class="fn" data-k="AC">AC</button>
        <button class="fn" data-k="±">±</button>
        <button class="fn" data-k="%">%</button>
        <button class="op" data-k="/">÷</button>

        <button data-k="7">7</button>
        <button data-k="8">8</button>
        <button data-k="9">9</button>
        <button class="op" data-k="*">×</button>

        <button data-k="4">4</button>
        <button data-k="5">5</button>
        <button data-k="6">6</button>
        <button class="op" data-k="-">−</button>

        <button data-k="1">1</button>
        <button data-k="2">2</button>
        <button data-k="3">3</button>
        <button class="op" data-k="+">+</button>

        <button data-k="0">0</button>
        <button data-k=".">.</button>
        <button class="fn" data-k="⌫">⌫</button>
        <button class="eq" data-k="=">=</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
